services:
  - type: web
    name: tiktok-ruong-tui-scanner
    runtime: docker
    # "free" = miễn phí, không cần thẻ. Nâng lên "starter" nếu muốn ổ đĩa giữ dữ liệu.
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Gói free không có ổ đĩa -> dùng /tmp (mất khi restart, không sao vì kèo rương/túi chỉ sống vài phút)
      - key: DB_PATH
        value: /tmp/data.db
      - key: PORT
        value: 8000
      # Điền sau trong Dashboard > Environment (hoặc bỏ trống rồi cấu hình trong /admin)
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT
        sync: false
      - key: TELEGRAM_ENABLED
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
